name: Bootstrap package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore package
        shell: bash
        run: |
          set -euo pipefail

          {
            head -c 8000 .bootstrap/part01
            cat .bootstrap/part02 .bootstrap/part03 .bootstrap/part04 .bootstrap/part05 .bootstrap/part06 .bootstrap/part07 .bootstrap/part08 .bootstrap/part09 .bootstrap/part10
          } | base64 --decode > /tmp/laravel-infrastructure.zip

          unzip -tq /tmp/laravel-infrastructure.zip

          rm -rf /tmp/laravel-infrastructure-package
          mkdir -p /tmp/laravel-infrastructure-package
          unzip -q /tmp/laravel-infrastructure.zip -d /tmp/laravel-infrastructure-package

          cp -a /tmp/laravel-infrastructure-package/laravel-infrastructure/. .

          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-package.yml
          rm -f .github/workflows/tests.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Initial Laravel infrastructure package"
          git push origin HEAD:main
