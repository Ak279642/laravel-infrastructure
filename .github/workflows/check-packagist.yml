name: check-packagist

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    if: github.event.head_commit.message == 'Verify Packagist v1.1.0'
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Wait for Packagist stable metadata
        run: |
          for attempt in $(seq 1 30); do
            composer clear-cache >/dev/null 2>&1 || true
            versions="$(composer show ak279642/laravel-infrastructure --all --no-ansi 2>/dev/null | sed -n 's/^versions *: //p')"
            echo "Attempt $attempt: $versions"
            if echo "$versions" | grep -q 'v1.1.0'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
