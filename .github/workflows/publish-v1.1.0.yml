name: publish-v1.1.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  RELEASE_SHA: f3b67e0c3106549ef5d3c2d37e490403df94df7d

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish v1.1.0 stable release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove superseded releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release delete v1.1.0 --yes --cleanup-tag || true
          git tag -d v1.0.0 2>/dev/null || true
          git tag -d v1.1.0 2>/dev/null || true
          git push origin :refs/tags/v1.0.0 2>/dev/null || true
          git push origin :refs/tags/v1.1.0 2>/dev/null || true

      - name: Publish stable v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.1.0 "$RELEASE_SHA" -m "v1.1.0 stable"
          git push origin v1.1.0

          cat > release-notes.md <<'EOF'
          # Laravel Infrastructure v1.1.0

          Production-grade stable release consolidating the package onto one supported version.

          Highlights:
          - hardened repository filtering, relations, sorting, scopes, search and selected/aggregate columns;
          - portable case-insensitive filtering verified on SQLite, MySQL and PostgreSQL;
          - deterministic caching, stampede protection and rollback-safe/after-commit invalidation;
          - automatic ValidationContext identity-map reuse with relation loading and atomic rollback restoration;
          - BaseAction, BaseService and transaction boundaries;
          - multiple model slug fields and scoped uniqueness;
          - automatic model file uploads plus safe file lifecycle handling;
          - dry-run-first orphan storage auditing;
          - standardized API responses/exceptions, correlation IDs and redacted structured logging;
          - traversal/filename/extension storage protections;
          - PHP 8.2-8.4 and Laravel 10-13 compatibility;
          - full PHPUnit, Pint and Larastan release gate passed.

          See CHANGELOG.md and README.md for full usage and migration details.
          EOF

          gh release create v1.1.0             --target "$RELEASE_SHA"             --title "v1.1.0"             --notes-file release-notes.md
