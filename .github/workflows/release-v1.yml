name: Publish v1.0.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish stable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_SHA="3425ea0e9511b7a27306ec2ced2f33a3949a2ab7"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "v1.0.0" >/dev/null 2>&1; then
            git tag -a v1.0.0 "$RELEASE_SHA" -m "v1.0.0"
            git push origin v1.0.0
          fi

          if ! gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v1.0.0 \
              --repo "${{ github.repository }}" \
              --target "$RELEASE_SHA" \
              --title "v1.0.0" \
              --notes "First stable release of ak279642/laravel-infrastructure. Includes repository infrastructure, tagged caching, repository-aware FormRequest validation, ValidationContext reuse, configurable slug generation, file lifecycle handling, API responses/exceptions, logging helpers, and transaction boundaries."
          fi

      - name: Remove one-time release workflow
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/release-v1.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Remove one-time v1.0.0 release workflow"
          git push origin HEAD:main
