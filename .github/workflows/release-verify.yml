name: release-verify

on:
  push:
    branches:
      - main

env:
  COMPOSER_NO_BLOCKING: 1

jobs:
  framework:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Select framework version
        run: |
          composer require --dev --no-update             "laravel/framework:${{ matrix.laravel }}"             "orchestra/testbench:${{ matrix.testbench }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer test
      - run: composer lint
      - run: composer analyse

  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: infrastructure
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: infrastructure
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d infrastructure"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_DRIVER: ${{ matrix.driver }}

    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: pdo_mysql, pdo_pgsql
          tools: composer:v2
      - run: |
          composer require --dev --no-update             "laravel/framework:^13.0"             "orchestra/testbench:^11.0"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit tests/Feature/FilterDriverCompatibilityTest.php
